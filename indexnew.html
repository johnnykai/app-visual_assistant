<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視覺助理 (小視窗大按鈕版)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-bottom: 20px; color: #00d4ff; font-size: 1.2rem; }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            /* 縮小寬度至約一半 (原為 600px) */
            max-width: 320px; 
            width: 100%;
        }
        
        .video-container {
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        
        video, canvas {
            width: 100%;
            border-radius: 8px;
            background: #0f0f23;
        }
        
        .controls {
            display: flex;
            flex-direction: column; /* 改為垂直排列讓按鈕更大 */
            gap: 12px;
            margin: 20px 0;
        }
        
        /* 放大按鈕 */
        button {
            width: 100%;
            padding: 20px; /* 增加高度 */
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 20px; /* 放大字體 */
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        #captureBtn { background: #00d4ff; color: #1a1a2e; }
        #askBtn { background: #7c3aed; color: white; }
        
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.4; transform: none; }
        
        #status {
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
        }
        .loading { background: #fbbf24; color: #1a1a2e; }
        .error { background: #ef4444; color: white; }
        .success { background: #22c55e; color: white; }

        .api-key-container {
            width: 100%;
            max-width: 320px;
            margin-top: 20px;
            padding: 15px;
            background: #16213e;
            border-radius: 12px;
        }
        .api-key-container label { display: block; margin-bottom: 8px; color: #00d4ff; font-size: 14px; }
        .api-key-container input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #0f0f23;
            color: #eee;
        }
        .get-api-key-btn {
            display: inline-block;
            margin-bottom: 10px;
            padding: 6px 12px;
            background: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>視覺助理</h1>
    
    <div class="container">
        <div class="video-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
            
            <div class="controls">
                <button id="captureBtn">📸 擷取畫面</button>
                <button id="askBtn" disabled>🔍 開始辨識</button>
            </div>
            
            <div id="status">準備中...</div>
        </div>
    </div>

    <div class="api-key-container">
        <a href="https://aistudio.google.com/api-keys" target="_blank" class="get-api-key-btn">獲取 Key</a>	
        <label for="apiKey">Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="貼上 Key">
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const askBtn = document.getElementById('askBtn');
        const status = document.getElementById('status');
        const apiKeyInput = document.getElementById('apiKey');

        let capturedImage = null;
        let apiKey = '';
        const modelName = 'gemini-2.0-flash'; 

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            window.speechSynthesis.speak(utterance);
        }

        async function initWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                status.textContent = '相機就緒';
                status.className = 'success';
            } catch (err) {
                status.textContent = '相機啟動失敗';
                status.className = 'error';
            }
        }

        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            capturedImage = canvas.toDataURL('image/jpeg', 0.85);
            askBtn.disabled = false;
            status.textContent = '擷取完成！點擊辨識';
            status.className = 'success';
            speak('已擷取');
        });

        apiKeyInput.addEventListener('input', (e) => {
            apiKey = e.target.value.trim();
        });

        async function askGemini() {
            if (!capturedImage) return;
            if (!apiKey) {
                status.textContent = '請輸入 API Key';
                status.className = 'error';
                speak('請輸入 API Key');
                return;
            }
            
            askBtn.disabled = true;
            captureBtn.disabled = true;
            status.textContent = '辨識中...';
            status.className = 'loading';
            speak('正在辨識');

            const base64Data = capturedImage.split(',')[1];
            const payload = {
                contents: [{
                    parts: [
                        { text: "這張圖片裡有什麼？請用繁體中文回答，一句話以內。" },
                        { inline_data: { mime_type: 'image/jpeg', data: base64Data } }
                    ]
                }],
                generationConfig: { temperature: 0.5, maxOutputTokens: 100 }
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || '無法辨識內容';
                
                status.textContent = '辨識完畢';
                status.className = 'success';
                speak(resultText);
                
            } catch (err) {
                status.textContent = '連線失敗';
                status.className = 'error';
                speak('辨識失敗');
            } finally {
                askBtn.disabled = false;
                captureBtn.disabled = false;
            }
        }

        askBtn.addEventListener('click', askGemini);
        initWebcam();
    </script>
</body>
</html>
