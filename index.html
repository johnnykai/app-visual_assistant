<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>視覺助理 (Gemini 2.5 版)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        
        .video-container {
            width: 180px; 
            background: #16213e;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        
        video {
            width: 100%;
            border-radius: 6px;
            background: #000;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
            max-width: 300px;
        }
        
        button {
            width: 100%;
            padding: 30px 10px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 6px 10px rgba(0,0,0,0.4);
        }
        
        #captureBtn { background: #00d4ff; color: #1a1a2e; }
        #askBtn { background: #7c3aed; color: white; }
        
        button:hover { transform: scale(1.02); }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.3; transform: none; }
        
        #status {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #fbbf24;
        }

        .api-key-area {
            margin-top: auto;
            padding: 20px;
            width: 100%;
            text-align: center;
        }
        #apiKey {
            background: #0f0f23;
            color: #fff;
            border: 1px solid #00d4ff;
            padding: 8px;
            border-radius: 5px;
            width: 80%;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div id="status">相機啟動中...</div>

    <div class="controls">
        <button id="captureBtn">📸 拍照</button>
        <button id="askBtn" disabled>🔍 辨識物品</button>
    </div>

    <div class="api-key-area">
        <input type="password" id="apiKey" placeholder="在此貼上 API Key">
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const captureBtn = document.getElementById('captureBtn');
        const askBtn = document.getElementById('askBtn');
        const status = document.getElementById('status');
        const apiKeyInput = document.getElementById('apiKey');

        let capturedImage = null;
        // 已更新為 Gemini 2.5 Flash
        const modelName = 'gemini-2.5-flash';

        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            window.speechSynthesis.speak(utterance);
        }

        async function initWebcam() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                status.textContent = '相機已就緒';
            } catch (err) {
                status.textContent = '相機權限錯誤';
            }
        }

        captureBtn.addEventListener('click', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            capturedImage = canvas.toDataURL('image/jpeg', 0.85);
            askBtn.disabled = false;
            status.textContent = '已拍照，請點擊辨識';
            speak('已拍照');
        });

        async function askGemini() {
            const apiKey = apiKeyInput.value.trim();
            if (!capturedImage || !apiKey) {
                const msg = !apiKey ? '請先輸入 API Key' : '請先拍照';
                status.textContent = msg;
                speak(msg);
                return;
            }
            
            askBtn.disabled = true;
            status.textContent = '辨識中...';
            speak('正在分析');

            const base64Data = capturedImage.split(',')[1];
            const payload = {
                contents: [{
                    parts: [
                        { text: "這張圖片裡有什麼？請用繁體中文簡單回答，一句話以內。" },
                        { inline_data: { mime_type: 'image/jpeg', data: base64Data } }
                    ]
                }]
            };

            try {
                // 使用更新後的模型進行 API 調用
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text || '我不知道這是什麼';
                
                status.textContent = '完成！';
                speak(resultText);
                
            } catch (err) {
                status.textContent = '辨識失敗';
                speak('網路錯誤或 API key 無效');
            } finally {
                askBtn.disabled = false;
            }
        }

        askBtn.addEventListener('click', askGemini);
        initWebcam();
    </script>
</body>
</html>
